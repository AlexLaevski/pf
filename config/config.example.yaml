# Lighter spread bot - example configuration.
#
# Copy to config/config.yaml and edit. Secrets stay out of this file: a venue
# names an environment variable and the key is read from the environment.
#
#   cp config/config.example.yaml config/config.yaml
#   export LIGHTER_CORE_PRIVATE_KEY=0x...
#   export LIGHTER_RH_PRIVATE_KEY=0x...
#   spreadbot validate -c config/config.yaml

mode: paper          # paper = simulated fills on live data | live = real orders
log_level: INFO

venues:
  # Lighter on Robinhood. LONG ONLY - this is the venue we buy into.
  #
  # Set base_url to that deployment's API host. It is a separate Lighter
  # domain from Core with its own order book and its own account index, and
  # the URL is not the Core one. Check it with:
  #     spreadbot markets --url <base_url>
  # `ws_url` defaults to the base URL with wss:// and /stream appended.
  lighter_rh:
    name: Lighter on Robinhood
    base_url: https://REPLACE-WITH-ROBINHOOD-LIGHTER-API-HOST
    # ws_url: wss://REPLACE-WITH-ROBINHOOD-LIGHTER-API-HOST/stream
    allowed_side: buy
    account_index: 0
    api_key_index: 0
    private_key_env: LIGHTER_RH_PRIVATE_KEY
    # Override the published fee schedule if your account has a different one.
    # maker_fee_bps: 0
    # taker_fee_bps: 2

  # Lighter Core. SHORT ONLY - this is the venue we hedge on.
  lighter_core:
    name: Lighter Core
    base_url: https://mainnet.zklighter.elliot.ai
    ws_url: wss://mainnet.zklighter.elliot.ai/stream
    allowed_side: sell
    account_index: 0
    api_key_index: 0
    private_key_env: LIGHTER_CORE_PRIVATE_KEY

roles:
  maker: lighter_rh      # where the passive limit order rests (long)
  hedge: lighter_core    # where the fill is hedged (short)

feed:
  transport: ws          # ws | rest (polling fallback)
  rest_poll_ms: 400
  depth_levels: 50
  staleness_ms: 3000     # a book older than this is not tradable

markets:
  - symbol: BTC
    order_base: 0.001          # size of one clip, in base units
    max_position_base: 0.005   # never hold more long than this
  - symbol: ETH
    order_base: 0.02
    max_position_base: 0.10
    # min_entry_bps: 4         # per-market override

# Where to rest the quote: in front of the first dense level.
gap:
  wall_notional_usd: 20000     # a level counts as a wall from this notional up
  wall_multiple: 4             # ...and at least this many times a typical level
  min_gap_bps: 1.5             # the hole above the wall must be this wide
  min_gap_ticks: 2             # ...and this many ticks
  min_wall_levels: 1           # walls may be a cluster of N consecutive levels
  join_offset_ticks: 1         # how far in front of the wall we sit
  max_levels_scan: 40
  max_distance_from_mid_bps: 50  # never quote further than this from mid
  # Fill-probability dial: a sweep has to clear everything resting at better
  # prices before it reaches us. Leave unset to ignore queue depth (and mostly
  # sit unfilled on a deep book); set it to the size of sweep you expect.
  # max_ahead_notional_usd: 50000

# When the trade is worth doing.
#
# The bar means different things in the two hedge modes below:
#   immediate -> the cross-venue spread, net of both venues' fees
#   delayed   -> the size of the bounce back up the hole, net of the maker fee
#                charged on both legs of the round trip
edge:
  min_entry_bps: 3.0           # net of fees, after the buffer below
  extra_buffer_bps: 0.5
  exit_bps: 0.5                # unwind once the reverse spread closes to here
  requote_ticks: 1             # reprice when the target moves this far
  requote_size_tol: 0.25
  hedge_is_taker: true

# WHEN the hedge fires. This is the biggest single choice in the config.
#
#   immediate -- hedge the instant the maker leg fills. Delta-neutral from the
#                first millisecond; earns only the cross-venue spread. Safe.
#
#   delayed   -- the scalp. After the fill the bot sits in a NAKED long for a
#                volatility-scaled window, hoping the sweep mean-reverts into
#                the take-profit below. The hedge is the fallback when it does
#                not. Earns much more per trade and carries real directional
#                risk while the window runs.
hedge:
  mode: immediate              # immediate | delayed

  # --- delayed mode only ---------------------------------------------------
  # Window length = base_seconds x (reference_vol / measured_vol), clamped.
  # So a calm token gets the long end, a jumpy one the short end.
  base_seconds: 30             # window at exactly the reference volatility
  min_seconds: 10              # ...never shorter than this
  max_seconds: 30              # ...never longer than this
  reference_vol_bps_per_min: 25
  vol_window_seconds: 180      # how much history the vol estimate looks at

  # The hard bound on the naked window. If the price we could hedge at has
  # fallen this far below our entry, the window ends NOW, whatever the clock
  # says. Without this the timer alone is unbounded risk - on a thin, fast
  # token 10 seconds is easily 1-2%.
  panic_bps: 50

  # Try to hedge as a maker first, then take whatever has not filled. Defaults
  # to true in delayed mode (a second of queue time is cheap there) and false
  # in immediate mode (where the point is to lock the spread at once).
  # maker_first: true
  maker_timeout_ms: 1200       # then cancel and take the rest
  maker_offset_ticks: 0        # 0 = join the touch

# Where the take-profit sits while we hold the naked long (delayed mode only).
bounce:
  target: hole_top             # hole_top | fixed_bps
  # hole_top aims back at the near edge of the gap we were filled through -
  # the level the sweep came from, and so where a reversion goes back to.
  target_bps: 20               # used when target: fixed_bps
  min_target_bps: 3            # floor, so a narrow hole cannot collapse onto the entry

# Фандинг — реальная стоимость удержания, и на горячем токене он съедает эдж
# целиком. Мы в лонге на maker-площадке и в шорте на hedge, поэтому платим
# разницу ставок. При 6 bps/час пятнадцать минут удержания стоят 1.5 bps.
funding:
  enabled: true
  expected_hold_minutes: 10    # сколько в среднем держим позицию
  max_cost_bps: 5              # рынок пропускается, если фандинг дороже этого
  refresh_seconds: 300

# Ротация рынков. Узкое место стратегии — ВРЕМЯ В РЫНКЕ: котировку могут взять
# только пока она стоит, а стоять она может только там, где в стакане дырка.
# Фиксированная горстка рынков означает простой большую часть дня.
#
# Рынок с открытой позицией или живым ордером никогда не ротируется наружу,
# а всё, что выводится, сначала зачищается через cancel_all.
rotation:
  enabled: false               # включать после того, как measure покажет эдж
  interval_seconds: 900
  watch: 12                    # сколько рынков держать одновременно
  max_churn: 4                 # не больше N замен за круг, чтобы не метаться
  clip_usd: 50                 # размер клипа для новых рынков
  min_volume_usd: 50000
  max_volume_usd: 500000000
  scan_delay_ms: 120           # пауза между запросами при скане

risk:
  max_open_notional_usd: 2000
  # Hard ceiling on naked exposure. Applies in BOTH modes and overrides the
  # bounce window: if the unhedged clip is worth more than this, it is hedged
  # immediately no matter how much time is left on the clock.
  max_unhedged_notional_usd: 250
  # Time limit on naked exposure in immediate mode. In delayed mode the time
  # limit is the volatility window under `hedge:` instead, and this is unused.
  unhedged_timeout_ms: 2000
  max_hedge_slippage_bps: 8
  max_daily_loss_usd: 200
  max_consecutive_errors: 5
  # Create this file to stop the bot from opening anything new.
  kill_switch_file: ./HALT

unwind:
  max_hold_seconds: 900        # force-close a pair older than this
  stop_loss_bps: 30
  passive_exit: true           # try a maker exit before taking
